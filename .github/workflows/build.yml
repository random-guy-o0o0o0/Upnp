name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libssl-dev libffi-dev liblzma-dev build-essential
          pip install --upgrade buildozer cython virtualenv

      - name: Configure Buildozer
        run: |
          buildozer init
          sed -i 's/title = My Application/title = Offline UPnP/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = upnp/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.offline/' buildozer.spec
          sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec

      - name: Build with Buildozer
        run: yes | buildozer android debug
